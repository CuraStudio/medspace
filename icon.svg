    <!-- Das "Med" Herz -->
    <path d="M 256 180 C 256 180 206 130 146 130 C 76 130 56 200 56 250 C 56 340 256 420 256 420 C 256 420 456 340 456 250 C 456 200 436 130 366 130 C 306 130 256 180 256 180 Z" stroke="#00796b" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Medizinisches Kreuz im Herz -->
    <line x1="256" y1="230" x2="256" y2="310" stroke="#00796b" stroke-width="14" stroke-linecap="round"/>
    <line x1="216" y1="270" x2="296" y2="270" stroke="#00796b" stroke-width="14" stroke-linecap="round"/>
